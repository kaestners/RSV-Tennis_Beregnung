<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewaesserung</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* Hintergrund */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("image.png") center no-repeat;
    background-size: 70%;
    opacity: 0.08;
    filter: blur(2px);
    z-index: -1;
}

.container {
    padding: 15px;
    max-width: 500px;
    margin: auto;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(15px);
}

.section {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* Buttons */
button {
    padding: 18px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* Zones */
.zone.active {
    background: #007bff;
}

/* Main Buttons */
.startBtn,
.stopBtn {
    font-size: 20px;
    padding: 20px;
    width: 100%;
}

.startBtn {
    background: #28a745;
}

.stopBtn {
    background: #e60000;
}

/* Slider */
input[type="range"] {
    width: 100%;
}

#apiLog, #status, #log {
    margin-top: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
<h2>Bewaesserung- RSV-Tennis&#127934</h2>

<!-- Auswahl -->
<div class="section">
<h3>Bereich</h3>
<div class="buttons">
<button class="zone" onclick="selectZone(1,this)">Ventil 1</button>
<button class="zone" onclick="selectZone(2,this)">Ventil 2</button>
<button class="zone" onclick="selectZone(3,this)">Ventil 3</button>
<button class="zone" onclick="selectZone('all',this)">Alle</button>
</div>
</div>

<!-- START mit Slider -->
<div class="section">
<h3>Start</h3>

<div style="text-align:center;font-size:28px;font-weight:bold;">
<span id="runVal">5</span> min
</div>

<input type="range" id="runSlider" min="1" max="30" value="5">

<div class="buttons" style="margin-top:10px;">
<button onclick="setPreset(5)">5 min</button>
<button onclick="setPreset(10)">10 min</button>
<button onclick="setPreset(15)">15 min</button>
</div>

<button class="startBtn" onclick="startWater()">Start</button>
</div>

<!-- AUSSETZEN -->
<div class="section">
<h3>Aussetzen</h3>

Stunden: <span id="hVal">2</span>
<input type="range" id="hours" min="0" max="24" value="2">

Minuten: <span id="mVal">0</span>
<input type="range" id="minutes" min="0" max="59" value="0">

<button class="stopBtn" onclick="suspendWater()">Aussetzen</button>
</div>

<!-- STOP -->
<div class="section">
<h3>STOP</h3>
<button class="stopBtn" onclick="stopWater()">NOT AUS</button>
</div>

<!-- API Log -->
<div class="section">
<h3>API Log</h3>
<div id="apiLog">Noch kein Aufruf</div>
</div>

<!-- Verlauf -->
<div class="section">
<h3>Verlauf</h3>
<div id="log"></div>
</div>

<div id="status">Bereit...</div>

</div>

<script>
const API_KEY = "7b31-8e11-c7b7-2901";

const RELAYS = {
1: "12308244",
2: "12308245",
3: "12308246"
};

// DOM
const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const hVal = document.getElementById("hVal");
const mVal = document.getElementById("mVal");
const runSlider = document.getElementById("runSlider");
const runVal = document.getElementById("runVal");

const statusBox = document.getElementById("status");
const apiLog = document.getElementById("apiLog");
const logBox = document.getElementById("log");

let selectedZone = null;

// Auswahl
function selectZone(zone, el) {
selectedZone = zone;
document.querySelectorAll(".zone").forEach(b => b.classList.remove("active"));
el.classList.add("active");
}

// Slider Anzeige
hours.oninput = () => hVal.innerText = hours.value;
minutes.oninput = () => mVal.innerText = minutes.value;
runSlider.oninput = () => runVal.innerText = runSlider.value;

// Presets
function setPreset(val){
runSlider.value = val;
runVal.innerText = val;
}

// Status
function setStatus(text){
statusBox.innerText = text;
}

// Verlauf
function addLog(text){
let logs = JSON.parse(localStorage.getItem("log") || "[]");
logs.unshift(`[${new Date().toLocaleString()}] ${text}`);
localStorage.setItem("log", JSON.stringify(logs));
logBox.innerHTML = logs.join("<br>");
}

// API Log
function logApi(url, text){
let safeUrl = url
.replace(/api_key=[^&]*/g, "api_key=*****")
.replace(/relay_id=[^&]*/g, "relay_id=***");

apiLog.innerHTML = `
<b>Request:</b><br>${safeUrl}<br><br>
<b>Antwort:</b><br><pre>${text}</pre>
`;
}

// API Call
function apiCall(url, msg){
fetch(url)
.then(r => r.text())
.then(t => {
logApi(url, t);
setStatus(msg);
})
.catch(() => {
logApi(url, "Befehl gesendet (Antwort vom Browser blockiert)");
setStatus("Befehl gesendet");
});
}

// START
function startWater(){
if(!selectedZone) return setStatus("Bitte Bereich waehlen");

let sec = runSlider.value * 60;

let url = selectedZone === "all"
? `https://api.hydrawise.com/api/v1/setzone.php?action=runall&api_key=${API_KEY}&perio_id=999&custom=${sec}`
: `https://api.hydrawise.com/api/v1/setzone.php?action=run&api_key=${API_KEY}&perio_id=999&relay_id=${RELAYS[selectedZone]}&custom=${sec}`;

apiCall(url, "Start gesendet");
addLog("Start " + selectedZone + " - " + runSlider.value + " min");
}

// STOP
function stopWater(){
if(!selectedZone) return setStatus("Bitte Bereich waehlen");

let url = selectedZone === "all"
? `https://api.hydrawise.com/api/v1/setzone.php?action=stopall&api_key=${API_KEY}`
: `https://api.hydrawise.com/api/v1/setzone.php?action=stop&api_key=${API_KEY}&relay_id=${RELAYS[selectedZone]}`;

apiCall(url, "Stop gesendet");
addLog("STOP " + selectedZone);
}

// AUSSETZEN
function suspendWater(){
if(!selectedZone) return setStatus("Bitte Bereich waehlen");

let sec = hours.value * 3600 + minutes.value * 60;
let now = Math.floor(Date.now()/1000);
let until = now + sec;

let url = selectedZone === "all"
? `https://api.hydrawise.com/api/v1/setzone.php?action=suspendall&api_key=${API_KEY}&perio_id=999&custom=${until}`
: `https://api.hydrawise.com/api/v1/setzone.php?action=suspend&api_key=${API_KEY}&perio_id=999&relay_id=${RELAYS[selectedZone]}&custom=${until}`;

apiCall(url, "Aussetzen gesendet");
addLog("Suspend " + selectedZone);
}
</script>

</body>
</html>
