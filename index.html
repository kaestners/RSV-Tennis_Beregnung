<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewaesserung</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

/* Hintergrund (Wasserzeichen!) */
.bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: url("image.png") center no-repeat;
    background-size: 70%;

    opacity: 1.0;
    filter: blur(2px);

    z-index: -2;
}

.container {
    padding: 15px;
    max-width: 500px;
    margin: auto;

    background: rgba(64,64,64,0.5);
    border-radius: 20px;

    backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,0.2);
}

h1 { text-align: center; }

.section {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.1);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;

    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.5);
    color: white;

    transition: all 0.2s ease;
}

button:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.2);
}

.zone.active {
    background: rgba(0,123,255,0.6);
}

.startBtn {
    background: rgba(40,167,69,0.6);
}

.stopBtn {
    background: rgba(230,0,0,0.7);
    font-weight: bold;
}

.statusBtn {
    background: rgba(108,117,125,0.6);
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 10px;

    border-radius: 10px;
    border: none;

    background: rgba(255,255,255,0.1);
    color: white;
}

#status, #liveStatus {
    margin-top: 15px;
    padding: 10px;
    border-radius: 10px;

    background: rgba(0,0,0,0.5);
}

#log {
    max-height: 150px;
    overflow-y: auto;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
    <h1>Bewaesserung</h1>

    <div class="section">
        <h3>Bereich</h3>
        <div class="buttons">
            <button class="zone" onclick="selectZone(1, this)">Ventil 1</button>
            <button class="zone" onclick="selectZone(2, this)">Ventil 2</button>
            <button class="zone" onclick="selectZone(3, this)">Ventil 3</button>
            <button class="zone" onclick="selectZone('all', this)">Alle</button>
        </div>
    </div>

    <div class="section">
        <h3>Start (Minuten)</h3>
        <input type="number" id="runTime" value="5">
        <button class="startBtn" onclick="startWater()">Start</button>
    </div>

    <div class="section">
        <h3>Aussetzen</h3>

        <label>Stunden: <span id="hVal">2</span></label>
        <input type="range" min="0" max="24" value="2" id="hours">

        <label>Minuten: <span id="mVal">0</span></label>
        <input type="range" min="0" max="59" value="0" id="minutes">

        <button class="stopBtn" onclick="suspendWater()">Aussetzen</button>
    </div>

    <div class="section">
        <h3>STOP</h3>
        <button class="stopBtn" onclick="stopWater()">NOT AUS</button>
    </div>

    <div class="section">
        <h3>System Status</h3>
        <button class="statusBtn" onclick="loadStatus()">Aktualisieren</button>
        <div id="liveStatus">Wird geladen...</div>
    </div>

    <div class="section">
        <h3>Verlauf</h3>
        <div id="log"></div>
    </div>

    <div id="status">Bereit...</div>
</div>

<script>
const API_KEY = 7b31-8e11-c7b7-2901;

const RELAYS = {
    1: "RELAY_ID_1",
    2: "RELAY_ID_2",
    3: 12308240
};

let selectedZone = null;
let pollTimer = null;

function selectZone(zone, el) {
    selectedZone = zone;
    document.querySelectorAll(".zone").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
}

const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");

hours.oninput = () => document.getElementById("hVal").innerText = hours.value;
minutes.oninput = () => document.getElementById("mVal").innerText = minutes.value;

function setStatus(msg, error=false) {
    const el = document.getElementById("status");
    el.innerText = msg;
    el.style.background = error ? "#a94442" : "rgba(0,0,0,0.5)";
}

function addLog(text) {
    let logs = JSON.parse(localStorage.getItem("log") || "[]");
    let now = new Date().toLocaleString();
    logs.unshift(`[${now}] ${text}`);
    localStorage.setItem("log", JSON.stringify(logs));
    renderLog();
}

function renderLog() {
    let logs = JSON.parse(localStorage.getItem("log") || "[]");
    document.getElementById("log").innerHTML = logs.slice(0,20).join("<br>");
}

function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    return `${m}m ${s}s`;
}

function startWater() {
    if (!selectedZone) return setStatus("Bitte Bereich waehlen", true);

    let sec = document.getElementById("runTime").value * 60;

    let url = selectedZone === "all"
        ? `https://api.hydrawise.com/api/v1/setzone.php?action=runall&api_key=${API_KEY}&perio_id=999&custom=${sec}`
        : `https://api.hydrawise.com/api/v1/setzone.php?action=runall&api_key=${API_KEY}&perio_id=999&relay_id=${RELAYS[selectedZone]}&custom=${sec}`;

    fetch(url)
        .then(() => {
            setStatus("Start OK");
            addLog("Start: " + selectedZone + " fuer " + sec + "s");
            loadStatus();
        })
        .catch(() => setStatus("Fehler beim Start", true));
}

function suspendWater() {
    if (!selectedZone) return setStatus("Bitte Bereich waehlen", true);

    let sec = (hours.value * 3600) + (minutes.value * 60);

    let url = selectedZone === "all"
        ? `https://api.hydrawise.com/api/v1/setzone.php?action=suspendall&api_key=${API_KEY}&perio_id=999&custom=${sec}`
        : `https://api.hydrawise.com/api/v1/setzone.php?action=suspend&api_key=${API_KEY}&perio_id=999&custom=${sec}`;

    fetch(url)
        .then(() => {
            setStatus("Ausgesetzt");
            addLog("Suspend: " + selectedZone + " fuer " + sec + "s");
            loadStatus();
        })
        .catch(() => setStatus("Fehler", true));
}

function stopWater() {
    if (!selectedZone) return setStatus("Bitte Bereich waehlen", true);

    let url = selectedZone === "all"
        ? `https://api.hydrawise.com/api/v1/setzone.php?action=stopall&api_key=${API_KEY}&perio_id=999`
        : `https://api.hydrawise.com/api/v1/setzone.php?action=stop&api_key=${API_KEY}&perio_id=999&relay_id=${RELAYS[selectedZone]}`;

    fetch(url)
        .then(() => {
            setStatus("Gestoppt");
            addLog("STOP: " + selectedZone);
            loadStatus();
        })
        .catch(() => setStatus("Fehler beim Stop", true));
}

function loadStatus() {

    if (pollTimer) clearTimeout(pollTimer);

    let url = `https://api.hydrawise.com/api/v1/statusschedule.php?api_key=${API_KEY}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.relays.forEach(r => {

                let running = (r.time == 1);

                html += `
                    <div style="
                        margin-bottom:10px;
                        padding:10px;
                        border-radius:15px;
                        background: rgba(255,255,255,0.08);
                        backdrop-filter: blur(10px);
                        border: 1px solid rgba(255,255,255,0.15);
                    ">
                        <b>${r.name}</b><br>
                        Status: <span style="color:${running ? '#28a745' : '#ccc'}">
                        ${running ? 'LAEUFT' : 'STOP'}
                        </span><br>
                        ${running ? "Restzeit: " + formatTime(parseInt(r.run)) : ""}
                        <br>
                        Naechster Start: ${r.timestr}
                    </div>
                `;
            });

            document.getElementById("liveStatus").innerHTML = html;

            let next = data.nextpoll || 30;
            pollTimer = setTimeout(loadStatus, next * 1000);

            setStatus("Status aktualisiert");

        })
        .catch(() => setStatus("Fehler beim Statusladen", true));
}

renderLog();
loadStatus();
</script>

</body>
</html>
