<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewässerung</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("image.png") center no-repeat;
    background-size: 70%;
    opacity: 0.8;
    filter: blur(2px);
    z-index: -1;
}

.container {
    padding: 15px;
    max-width: 500px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
}

.section {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(64,64,62,0.48);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    padding: 15px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: rgba(64,64,64,0.61);
    color: white;
}

.zone.active {
    background: #007bff;
}

.startBtn { background: #28a745; }
.stopBtn  { background: #e60000; }

input[type="range"] {
    width: 100%;
}

#status {
    margin-top: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
<h2>Bewässerung RSV Tennis 🎾</h2>

<!-- AUSWAHL -->
<div class="section">
<h3>Platz auswählen</h3>
<div class="buttons">
<button class="zone" onclick="selectZone(1,this)">Platz 1</button>
<button class="zone" onclick="selectZone(2,this)">Platz 2</button>
<button class="zone" onclick="selectZone(3,this)">Platz 3</button>
<button class="zone" onclick="selectZone('all',this)">Alle</button>
</div>
</div>

<!-- START -->
<div class="section">
<h3>Dauer<br> &nbsp1.Platz auswählen<br>&nbsp2.Dauer auswählen<br>&nbsp3.Start drücken</h3>

<div style="text-align:center;font-size:24px;">
<span id="runVal">5</span> Minuten
</div>

<input type="range" id="runSlider" min="1" max="15" value="5">

<!-- Preset Buttons -->
<div class="buttons" style="margin-top:10px;">
<button onclick="setPreset(2)">2 min</button>
<button onclick="setPreset(5)">5 min</button>
<button onclick="setPreset(10)">10 min</button>
<button onclick="setPreset(15)">15 min</button>
</div>

<button class="startBtn" onclick="startWater()">Start</button>
</div>

<!-- AUSSETZEN -->
<div class="section">
<h3>Aussetzen<br>&nbsp1.Platz auswählen<br>&nbsp2.Dauer der Bewässerungspause auswählen<br>&nbsp3.Aussetzen drücken</h3>

Stunden: <span id="hVal">2</span>
<input type="range" id="hours" min="0" max="24" value="2">

Minuten: <span id="mVal">0</span>
<input type="range" id="minutes" min="0" max="59" value="0">

<button class="stopBtn" onclick="suspendWater()">Aussetzen</button>
</div>

<!-- STOP -->
<div class="section">
<h3>STOP</h3>
<button class="stopBtn" onclick="stopWater()">NOT AUS</button>
</div>

<div id="status">Bereit...</div>

</div>

<script>
const RELAYS = {
    1: "12308244",
    2: "12308245",
    3: "12308246"
};

let selectedZone = null;

// Elemente
const runSlider = document.getElementById("runSlider");
const runVal = document.getElementById("runVal");

const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const hVal = document.getElementById("hVal");
const mVal = document.getElementById("mVal");

const statusBox = document.getElementById("status");

// Slider Anzeigen
runSlider.oninput = () => runVal.innerText = runSlider.value;
hours.oninput = () => hVal.innerText = hours.value;
minutes.oninput = () => mVal.innerText = minutes.value;

// Preset Buttons
function setPreset(val){
    runSlider.value = val;
    runVal.innerText = val;
}

// Platz auswählen
function selectZone(zone, el) {
    selectedZone = zone;
    document.querySelectorAll(".zone").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
}

// Status
function setStatus(text){
    statusBox.innerText = text;
}

// API Call
async function apiCall(endpoint, payload, msg){
    try {
        const res = await fetch(endpoint, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            const t = await res.text();
            setStatus("Fehler: " + t);
        } else {
            setStatus(msg);
        }

    } catch (err) {
        setStatus("Netzwerkfehler");
        console.error(err);
    }
}

// START
function startWater(){
    if(!selectedZone) return setStatus("Bitte Platz wählen");

    apiCall("/api/start", {
        zone: selectedZone,
        relays: RELAYS,
        duration: runSlider.value * 60
    }, "Start gesendet");
}

// STOP
function stopWater(){
    if(!selectedZone) return setStatus("Bitte Platz wählen");

    apiCall("/api/stop", {
        zone: selectedZone,
        relays: RELAYS
    }, "Stop gesendet");
}

// AUSSETZEN
function suspendWater(){
    if(!selectedZone) return setStatus("Bitte Platz wählen");

    let duration = (hours.value * 3600) + (minutes.value * 60);

    apiCall("/api/suspend", {
        zone: selectedZone,
        relays: RELAYS,
        duration: duration
    }, "Aussetzen gesendet");
}
</script>

</body>
</html>
