<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewässerung</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("image.png") center no-repeat;
    background-size: 70%;
    opacity: 0.8;
    filter: blur(2px);
    z-index: -1;
}

.container {
    padding: 15px;
    max-width: 500px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
}

.section {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    padding: 15px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    color: white;
}

.zone.active {
    background: #007bff;
}

.startBtn { background: #28a745; }
.stopBtn  { background: #e60000; }

input[type="range"] {
    width: 100%;
}

#apiLog, #status {
    margin-top: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
<h2>Bewässerung RSV Tennis 🎾</h2>

<div class="section">
<h3>Platz auswählen</h3>
<div class="buttons">
<button class="zone" onclick="selectZone(1,this)">Platz 1</button>
<button class="zone" onclick="selectZone(2,this)">Platz 2</button>
<button class="zone" onclick="selectZone(3,this)">Platz 3</button>
<button class="zone" onclick="selectZone('all',this)">Alle</button>
</div>
</div>

<div class="section">
<h3>Dauer</h3>

<div style="text-align:center;font-size:24px;">
<span id="runVal">5</span> Minuten
</div>

<input type="range" id="runSlider" min="1" max="15" value="5">

<button class="startBtn" onclick="startWater()">Start</button>
</div>

<div class="section">
<h3>STOP</h3>
<button class="stopBtn" onclick="stopWater()">NOT AUS</button>
</div>

<div class="section">
<h3>API Log</h3>
<div id="apiLog">Noch kein Aufruf</div>
</div>

<div id="status">Bereit...</div>

</div>

<script>
const RELAYS = {
    1: "12308244",
    2: "12308245",
    3: "12308246"
};

let selectedZone = null;

const runSlider = document.getElementById("runSlider");
const runVal = document.getElementById("runVal");
const statusBox = document.getElementById("status");
const apiLog = document.getElementById("apiLog");

runSlider.oninput = () => runVal.innerText = runSlider.value;

function selectZone(zone, el) {
    selectedZone = zone;
    document.querySelectorAll(".zone").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
}

function setStatus(text){
    statusBox.innerText = text;
}

function logApi(endpoint, payload, response){
    apiLog.innerHTML =
    "<b>Endpoint:</b><br>" + endpoint +
    "<br><br><b>Payload:</b><br><pre>" + JSON.stringify(payload, null, 2) +
    "</pre><br><b>Antwort:</b><br><pre>" + response + "</pre>";
}

async function apiCall(endpoint, payload, msg){
    try {
        const res = await fetch(endpoint, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const text = await res.text();
        logApi(endpoint, payload, text);

        if (!res.ok) {
            setStatus("Fehler: " + text);
        } else {
            setStatus(msg);
        }

    } catch (err) {
        setStatus("Netzwerkfehler");
        console.error(err);
    }
}

function startWater(){
    if(!selectedZone) return setStatus("Bitte Platz wählen");

    apiCall("/api/start", {
        zone: selectedZone,
        relays: RELAYS,
        duration: runSlider.value * 60
    }, "Start gesendet");
}

function stopWater(){
    if(!selectedZone) return setStatus("Bitte Platz wählen");

    apiCall("/api/stop", {
        zone: selectedZone,
        relays: RELAYS
    }, "Stop gesendet");
}
</script>

</body>
</html>
